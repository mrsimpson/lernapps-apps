name: Anhang-Test
description: Test, ob ein Workflow angehängte Dateien lesen kann.
title: "Anhang-Test: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Nur ein Test. Der Inhalt darf erfunden sein.
  - type: input
    id: fach
    attributes:
      label: Fach
      placeholder: z. B. Mathematik
    validations:
      required: true
  - type: input
    id: klassenstufe
    attributes:
      label: Klassenstufe
      placeholder: z. B. 5
    validations:
      required: true
  - type: input
    id: bundesland
    attributes:
      label: Bundesland
      placeholder: z. B. Bayern
  - type: input
    id: lehrwerk
    attributes:
      label: Lehrwerk
  - type: textarea
    id: inhalt
    attributes:
      label: Inhalt
      description: Der Inhalt der Lern-App als Text. Auch eine Datei lässt sich hier hineinziehen.
    validations:
      required: true
